<html>

<head>
    <title>
        Async and Wait homework
    </title>
</head>

<body>
    <p id="results"></p>
    <script>
        async function multiply(a, b) {
            let response = await a * b;
            display(response);
        }

        function display(some) {
            document.getElementById("results").innerHTML = some;
        }
        multiply(3, 50)
    </script>
</body>

</html>
