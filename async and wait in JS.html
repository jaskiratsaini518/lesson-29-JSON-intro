<html>

<head>
    <title>
        Async / Wait in JS
    </title>
</head>

<body>
    <p id="results"></p>
    <script>
        async function add(a, b) {
            let response = await a + b;
            display(response);
        }

        function display(some) {
            document.getElementById("results").innerHTML = some;
        }
        add(5, 20)
    </script>
</body>

</html>
